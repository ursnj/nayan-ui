[package]
name = "engine-core"
version = "0.1.0"
edition = "2024"
description = "Simulation core for @nayan-ui/engine"
license = "MIT"

[lib]
name = "engine_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.23.1"
cpal = "0.18.2"
earcutr = "0.5.0"
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
hound = "3.5.1"
i_overlay = "9.0.1"
jpeg-decoder = { version = "0.3.2", default-features = false }
png = "0.18.1"
pollster = "1.0.1"
rapier3d = "0.36.1"
raw-window-handle = "0.6.2"
rtrb = "0.4.0"
ttf-parser = "0.25.1"
# Vulkan with a GLES fallback on Android, Metal on Apple; nothing else is compiled in.
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "std", "vulkan", "gles", "metal"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

# Size: dependencies are built for size, except the physics engine, which is hot every step. The
# engine's own crate stays at opt-level 3. Saves ~5% of the linked library at no measured speed cost.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.rapier3d]
opt-level = 3

[profile.release.package.parry3d]
opt-level = 3

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-avf-audio = "0.3.2"
objc2-core-haptics = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out", "msl-out", "spv-out"] }

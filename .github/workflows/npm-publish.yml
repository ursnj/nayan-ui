name: Build and publish nayan-ui

on:
  workflow_dispatch:
    inputs:
      command:
        description: Package operation
        type: choice
        required: true
        default: validate
        options:
          - validate
          - publish

permissions:
  contents: read

jobs:
  validate:
    if: toJSON(github.event.repository.private) == 'false' && inputs.command == 'validate'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-npm-package
        id: package

      - name: Dry-run npm publishing
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: ${{ steps.package.outputs.dist-tag }}
        run: npm publish "$TARBALL" --access public --tag "$DIST_TAG" --ignore-scripts --dry-run --loglevel=warn

  publish:
    if: >-
      toJSON(github.event.repository.private) == 'false' &&
      github.repository == 'ursnj/nayan-ui' &&
      inputs.command == 'publish'
    runs-on: macos-15
    timeout-minutes: 120
    concurrency:
      group: nayan-ui-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-npm-package
        id: package

      - name: Publish the tested tarball to npm
        shell: bash
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: ${{ steps.package.outputs.dist-tag }}
        run: npm publish "$TARBALL" --access public --tag "$DIST_TAG" --ignore-scripts --loglevel=warn

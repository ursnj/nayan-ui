name: Build engine

on:
  push:
    branches: [refactor-nayan-ui, main]
    paths:
      - packages/engine/**
      - bun.lock
      - package.json
      - .github/workflows/npm-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5

      - name: Restore tested core build
        id: core-cache
        uses: actions/cache@v4
        with:
          path: packages/engine/native/core/build
          key: engine-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/engine/native/core/**', 'packages/engine/native/*/rust/**', '.github/workflows/npm-publish.yml') }}

      - name: Set up Android SDK
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and WebAssembly compiler
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          brew install llvm lld

      - name: Set up Rust toolchain
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine/native/core -> target
          cache-on-failure: true

      - name: Test Rust core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: cargo test --locked --manifest-path packages/engine/native/core/Cargo.toml

      - name: Install matching wasm-bindgen CLI
        if: steps.core-cache.outputs.cache-hit != 'true'
        working-directory: packages/engine
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; print $3; exit }' native/core/Cargo.lock | tr -d '"')"
          if ! wasm-bindgen --version | grep -Fxq "wasm-bindgen $version"; then
            cargo install wasm-bindgen-cli --locked --version "$version"
          fi

      - name: Build iOS, Android and WebAssembly libraries
        if: steps.core-cache.outputs.cache-hit != 'true'
        working-directory: packages/engine
        run: |
          native/core/scripts/build-ios.sh
          native/core/scripts/build-android.sh
          native/core/scripts/build-web.sh

      - name: Share core build with the packaging job
        uses: actions/upload-artifact@v4
        with:
          name: engine-core
          path: packages/engine/native/core/build
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: engine-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install engine dependencies
        run: bun install --frozen-lockfile --filter @nayan-ui/engine --linker hoisted

      - uses: actions/download-artifact@v4
        with:
          name: engine-core
          path: packages/engine/native/core/build

      - name: Build the JavaScript package
        working-directory: packages/engine
        run: |
          bun scripts/build-web.mjs
          bun x bob build

      - name: Check types and run engine tests
        run: |
          bun run engine:typecheck
          bun run engine:test
          bun run engine:test:integration

      - name: Validate and pack the npm package
        working-directory: packages/engine
        run: |
          npm pack --ignore-scripts --dry-run --json | node scripts/check-package.mjs --pack-json
          npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: nayan-ui-engine
          path: ${{ runner.temp }}/nayan-ui-engine-*.tgz
          if-no-files-found: error
          retention-days: 7

name: Build and publish nayan-ui

on:
  push:
    branches: [refactor-nayan-ui, main]
    tags: ['v*']
    paths:
      - packages/nayan-ui/**
      - bun.lock
      - bunfig.toml
      - .bun-version
      - package.json
      - .github/workflows/npm-publish.yml
      - .github/actions/build-npm-package/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: toJSON(github.event.repository.private) == 'false' && (github.event_name != 'push' || github.ref_type != 'tag')
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-npm-package

  publish:
    if: toJSON(github.event.repository.private) == 'false' && github.repository == 'ursnj/nayan-ui' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-npm-package

      - name: Publish the tested tarball to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="$RUNNER_TEMP/nayan-ui-$version.tgz"
          if [[ ! -f "$tarball" ]]; then
            echo '::error::The Git tag must match the version in packages/nayan-ui/package.json, prefixed with v.'
            exit 1
          fi

          dist_tag=latest
          if [[ "${version%%+*}" == *-* ]]; then
            dist_tag=beta
          fi
          npm publish "$tarball" --access public --tag "$dist_tag" --ignore-scripts

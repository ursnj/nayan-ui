name: Bug report
description: Report a problem with Nayan UI or this repository.
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Nayan UI SDK (components, games, and modules)
        - Website and docs
        - Starter template and CLI
        - Build and publishing
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe what you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Share the steps, a small example, or the failing command. Add logs or screenshots if they help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the package version or commit and any relevant platform or tool versions.
